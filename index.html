nter;background:radial-gradient(circle at 50% 77%,#c49c8c55 0 25%,transparent 25%),linear-gradient(140deg,#fcf4e7,#e9dbcb)}.hero:before{content:"";position:absolute;inset:9px;border:1px solid #b99d73;border-radius:120px 120px 5px 5px}.lotus{font-size:82px;color:#986371;line-height:1}.progress{height:4px;background:#e9ddd1;margin:20px 0 30px}.bar{height:100%;background:var(--wine);transition:width .25s}.context{font-size:14px;line-height:1.95;color:#685b55;margin:12px 0 14px;white-space:pre-line}.ask{font-size:17px;color:#744451;font-weight:600;line-height:1.7;margin-top:13px}.scene{font-size:12px;letter-spacing:3px;color:var(--wine)}.opts{display:grid;gap:12px;margin:26px 0 28px}.opt{background:transparent;border:1px solid #d7c8ba;border-radius:4px;text-align:left;display:flex;align-items:center;gap:15px;padding:18px 15px;line-height:1.8;color:var(--ink);font-size:15px;min-height:74px}.opt em{font-size:18px;color:#ad877e;font-style:normal}.opt.chosen{border:1.5px solid var(--wine);background:#f7ece9}.nav{display:flex;gap:12px;margin-top:auto}.nav .outline{flex:1}.nav .cta{flex:2}.result-card{background:linear-gradient(160deg,#fcf5e7,#f4e6dd);border:1px solid #d2bda1;padding:24px 20px;text-align:center;position:relative}.result-card:before{content:"";position:absolute;inset:7px;border:1px solid #ddc9b1;pointer-events:none}.result-card>*{position:relative}.result-name{font-size:54px;letter-spacing:10px;color:#743c4a;margin:12px 0}.tag{color:#9b6270;font-size:16px;letter-spacing:4px}.quote{font-size:17px;line-height:1.9;margin:26px 0;color:#63434b}.section-title{font-size:19px;color:#754553;margin:28px 0 12px}.reason{border-left:2px solid #b69372;padding:9px 0 9px 15px;margin:14px 0;font-size:14px;line-height:1.9}.reason small{display:block;color:#987567;margin-bottom:5px}.muted{color:var(--muted);font-size:13px;line-height:1.9}.meter{display:flex;align-items:center;gap:12px;font-size:12px;margin:12px 0}.meter span{width:66px}.track{flex:1;background:#ebded2;height:7px}.fill{background:#a86673;height:100%}.meter b{width:35px;text-align:right;color:#77585b}.actions{display:grid;gap:10px;margin:25px 0 0}.chapter{font-size:12px;color:var(--wine);letter-spacing:2px}.secondary{background:#f5ede4;border:1px solid #dec8b9;padding:15px;line-height:1.9}.hidden{display:none!important}@media(min-width:600px){body{padding:25px 0}.app,.screen{min-height:calc(100svh - 50px)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="app" id="app" aria-live="polite"></main><script>
const DATA={"questions":[{"scene":"殿选之时","title":"皇上在殿选时注意到了你","options":["刻意收敛锋芒，只求落选","大方展示才华，既来之则争取机会","谨慎得体，不争取也不失礼","观察皇上和太后的喜好，选择最有利的回答"],"vectors":[[0,1,2,4,0,2],[4,2,1,2,4,1],[1,2,3,3,1,2],[3,4,1,1,1,4]],"context":"你原本希望落选，回家过平静日子。可轮到你殿选时，皇上却因为你的相貌与谈吐对你起了兴趣。太后也在一旁观察，你的一句话就可能决定能否留在宫里。","ask":"此刻，你会怎样回答皇上的问话？"},{"scene":"两宫邀约","title":"皇后与华妃都想拉拢你","options":["接受皇后的庇护，依靠名正言顺的秩序","投向圣眷正浓的华妃，抢占眼前机会","不依附任何阵营，甘愿暂时被冷落","两边维持往来，不暴露真正的打算"],"vectors":[[3,3,2,1,1,4],[4,2,2,1,4,3],[0,1,2,4,3,1],[3,4,1,2,1,4]],"context":"刚入宫，你还没有得到皇上的正式宠爱。掌管六宫的皇后派人示好，圣眷正浓、行事强势的华妃也向你递出橄榄枝。你知道一旦依附其中一方，就可能被另一方视为敌人。","ask":"面对两边的拉拢，你打算怎么做？"},{"scene":"倚梅园冒名","title":"余莺儿冒认倚梅园吟诗之人","options":["直接告诉皇上：当晚在倚梅园吟诗的人其实是我。","暂不表明身份，设法让余莺儿在皇上面前答不上当夜的细节。","不去揭穿；既然我本来不想争宠，就让这件事过去。","私下找余莺儿，要求她拿出实际好处来交换我的沉默。"],"vectors":[[4,1,1,3,4,1],[3,4,1,2,2,4],[0,1,2,4,0,1],[3,4,0,1,1,4]],"context":"除夕夜，你独自在倚梅园祈福，吟诵了“逆风如解意，容易莫摧残”。皇上在附近听见，却没有看清你的模样。后来，宫女余莺儿冒认自己是那夜吟诗的人，因此被皇上看中并获得晋升。只有你清楚事情的真相。","ask":"如果你是当时真正吟诗的人，会怎么处理？"},{"scene":"请安受辱","title":"华妃当众羞辱了你","options":["当场反驳，即便受罚也不容羞辱","暂时低头，事后寻找反击机会","说软话平息冲突，尽快脱身","不作声，暗查她的把柄以求后用"],"vectors":[[3,0,1,4,4,1],[3,4,1,2,1,4],[0,1,3,1,0,3],[4,4,0,2,0,4]],"context":"一次请安时，华妃当着众人的面讥讽你的出身，还故意让你长时间跪着。皇后没有立即出面干预，其他妃嫔也不敢替你说话。你知道顶撞她可能受更重的处罚，但一味忍让也可能让她变本加厉。","ask":"此刻你会如何应对华妃？"},{"scene":"惊鸿舞宴","title":"有人在宫宴上故意让你献舞","options":["拿出本领，堂堂正正惊艳全场","顺势改变表演安排，巧妙化解陷阱","坦言不擅长，拒绝被旁人牵着走","邀请设局者同台，让她承担相同风险"],"vectors":[[3,2,1,3,4,1],[3,4,1,3,2,3],[0,1,2,4,2,1],[3,3,1,3,4,2]],"context":"在宫宴上，有人突然提议让你当众跳《惊鸿舞》，明知你没有提前准备，仍催促你起身。皇上和众妃嫔都在场；若表演失误，你可能沦为笑柄，但若表现出众，也可能得到赏识。","ask":"面对这场临时的考验，你会怎样做？"},{"scene":"旧敌失势","title":"曾经欺负你的余莺儿失势了","options":["以牙还牙，让她体会自己受过的屈辱","依宫规处理，不额外羞辱她","不再理会，自己向前走","以宽恕为条件，换取她掌握的秘密"],"vectors":[[4,1,0,2,4,3],[2,3,3,3,2,2],[0,1,2,4,0,1],[3,4,0,1,1,4]],"context":"余莺儿曾仗着受宠，故意给你难堪，还欺压身边的宫人。如今她犯错失势，往日奉承她的人纷纷翻脸，你也有机会影响她受到怎样的对待。","ask":"轮到你掌握主动权时，你会如何处理这位旧敌？"},{"scene":"眉庄蒙冤","title":"沈眉庄被指控假孕争宠","options":["当着皇上的面替沈眉庄担保，即使可能被一起责罚。","先不公开表态，暗查负责诊脉的太医及相关证物。","先请求皇上不要重罚沈眉庄，之后再设法查明真相。","暂时与她保持距离，以免自己也被牵连失宠。"],"vectors":[[1,1,4,4,4,0],[2,4,4,3,1,3],[1,3,4,2,1,2],[1,3,0,2,0,4]],"context":"沈眉庄原本因怀有身孕备受关照，却突然被揭发怀孕一事有假，皇上十分愤怒，她随即失宠。你知道她并非会用这种手段争宠的人，但太医的说法和眼前证据都对她不利。贸然求情也可能牵连你。","ask":"你最先会采取什么行动？"},{"scene":"翊坤宫罚跪","title":"华妃让你的好友在烈日下罚跪","options":["立刻冲过去替好友求情，哪怕被华妃一起罚跪。","马上去请皇上或太后出面，阻止华妃继续处罚。","向华妃低头服软，提出由我代好友承受另一项处罚。","先秘密留下证人和证据，日后设法让华妃失去处罚别人的权力。"],"vectors":[[1,0,4,4,4,0],[2,4,4,2,1,2],[0,1,4,1,1,2],[4,4,3,2,1,4]],"context":"华妃在烈日下罚你的好友跪着，对方身体虚弱，已经快要支撑不住。华妃明言谁敢求情便一起受罚。周围宫人不敢靠近，若再耽误下去，好友可能受到严重伤害。","ask":"你现在会怎样救她？"},{"scene":"姐妹背叛","title":"你发现最信任的姐妹背叛了你","options":["直接摊牌，要求她解释","佯装不知，用假消息试探她","悄悄疏远，从此不再分享私事","将计就计，通过她传递误导消息"],"vectors":[[1,1,4,4,4,1],[2,4,1,3,1,4],[0,2,2,4,0,3],[4,4,0,2,1,4]],"context":"你与一位姐妹相识多年，曾一起经历入宫后的艰难。最近你发现，她多次将你私下说的话告诉皇后，甚至使你陷入险境。今晚她又像什么都没发生一样前来谈心，而你已经掌握了她泄密的证据。","ask":"面对这段已经变质的友情，你会怎么做？"},{"scene":"欢宜香真相","title":"你发现欢宜香背后的秘密","options":["直接告诉华妃：欢宜香里可能藏着害她的东西。","暂时守住秘密，不愿亲手击碎她对皇上的信任。","把香料的证据藏起来，必要时用它保全自己。","秘密调查是谁授意配制这种香，让幕后之人承担后果。"],"vectors":[[1,1,4,4,4,1],[0,1,4,2,0,2],[3,4,0,1,0,4],[4,4,2,3,3,3]],"context":"华妃一直珍爱皇上赏赐的“欢宜香”，以为这是独属于自己的恩宠。你偶然获知香中藏有不利于生育的成分，而她多年来对此毫不知情。这个秘密不只会伤害华妃，也可能牵涉赐香之人的用意。","ask":"知道这件事之后，你会怎么处理这个秘密？"},{"scene":"甘露寺寒夜","title":"你被迫离宫，在甘露寺受尽冷遇","options":["放下过往，重新安排自由人生","默默积蓄力量，有朝一日洗刷冤屈","即使贫苦，也不向旧敌屈服","积极寻找靠山和资源，改变处境"],"vectors":[[0,1,3,4,0,1],[4,4,1,3,2,4],[0,1,3,4,2,2],[3,4,1,1,1,4]],"context":"你失去皇上的信任，离开皇宫，到甘露寺过清苦生活。曾经亲近的人不敢与你往来，寺中也有人欺负你；过去的身份与荣华都无法再保护你。你可以试着放下过去，也可以想办法重新改变命运。","ask":"在这样看不到出路的日子里，你会选择什么方向？"},{"scene":"果郡王之情","title":"你与果郡王的感情面临危险","options":["选择爱情，共担未知的后果","忍痛拒绝，不让家人承受风险","先安排家人与退路，再决定去留","结束这段感情，不再让爱情成为软肋"],"vectors":[[0,1,4,4,3,0],[1,2,4,2,1,3],[2,4,4,3,1,3],[3,2,0,4,1,4]],"context":"离宫后，一位真心爱你的人愿意放下身份与你远走，从此不再卷入宫廷争斗。但你心里明白，自己的过去与家族牵连太多，一旦被发现，这段感情可能让他与你的家人都陷入危险。","ask":"爱情与亲人的安危发生冲突时，你会怎么选？"},{"scene":"熹妃回宫","title":"你获得了以熹妃身份回宫的机会","options":["回宫，向旧敌讨回公道","回宫，以新身份保护亲人","留在宫外，选择自由","回宫，暗中建立不依附他人的势力"],"vectors":[[4,2,1,3,4,4],[3,3,4,2,2,3],[0,1,3,4,1,1],[4,4,1,4,2,4]],"context":"你得到了重新回宫的机会。回去意味着可以恢复地位，保护遭受牵连的家人，也意味着再次面对那些曾伤害过你的人。留下来或许更自由，却可能无力改变家人的处境。","ask":"这一次，你会为了什么作出选择？"},{"scene":"滴血验亲","title":"你在滴血验亲中遭到公开指控","options":["要求公开对质，正面指出破绽","冷静逐项核验，逼幕后之人露面","先争取皇上信任，以稳定局势","早备反击证据，不只自救，更要清算设局者"],"vectors":[[2,2,2,4,4,1],[3,4,2,3,1,4],[3,3,1,1,1,3],[4,4,0,3,3,4]],"context":"在众人面前，你突然被指控与他人私通，甚至连孩子的身世也受到质疑。指控者准备了证人与所谓证物，皇上面露怀疑，所有目光都集中在你身上。你必须迅速自证清白，还要防止有人继续设局。","ask":"你会怎样扭转这场危机？"},{"scene":"六宫终局","title":"终于可以亲自选择余生的方向","options":["享有最高的地位，无人敢轻视","保全所爱的人，让他们安稳生活","远离争斗，重获自由与平静","掌握权力，亲自制定新的规则"],"vectors":[[4,2,0,2,4,3],[1,1,4,2,1,1],[0,0,3,4,0,0],[4,4,2,4,2,3]],"context":"多年过去，你经历了受宠、失势、背叛与离别，也终于拥有选择未来的能力。如今，你可以继续留在权力中心，保护身边的人，或试着摆脱这座宫城的束缚。没有哪条路能让你拥有一切。","ask":"如果由你决定余生，你最想守住什么？"}],"roles":[{"name":"甄嬛","tag":"以柔为甲，以智为刃","p":[3.3,3.7,3.5,3.3,2.2,3.3],"quote":"你不是生来就懂得保护自己，只是逐渐学会把温柔与锋芒放在一起。","strong":"善于在困境中成长，既看重情义，也能权衡现实。","weak":"有时承担太多，不敢坦然示弱。"},{"name":"华妃","tag":"骄傲炽烈，敢爱敢恨","p":[4,1.1,2.5,3,4,1.8],"quote":"你要的从不是含糊的偏爱，而是明目张胆的坚定选择。","strong":"果敢鲜明，不喜欢隐藏态度。","weak":"情绪先行时，容易被他人利用。"},{"name":"沈眉庄","tag":"清醒自持，自有风骨","p":[0.8,1.8,3.9,3.9,1.8,2],"quote":"你并非争不过，而是明白有些东西不值得争。","strong":"忠诚坚定，始终有自己的原则。","weak":"失望之后，容易关上心门。"},{"name":"安陵容","tag":"心思细腻，步步谨慎","p":[2.9,3.1,1.3,0.9,0.5,4],"quote":"你察觉得到所有未说出口的话，却不容易说出自己的委屈。","strong":"敏锐谨慎，适应复杂环境。","weak":"过度在意评价，可能限制自己。"},{"name":"宜修皇后","tag":"深谋远虑，运筹帷幄","p":[4,4,0.5,1.8,0.5,4],"quote":"你更相信布局，而不是侥幸。","strong":"善于长期规划，能够隐忍等待。","weak":"控制感过强时，信任会变得困难。"},{"name":"叶澜依","tag":"自由孤勇，不受驯服","p":[0.5,1.2,3,4,3.5,1],"quote":"深宫可以困住一个人，却未必困得住一颗自由的心。","strong":"独立率真，忠于真实感受。","weak":"过于决绝时，容易失去转圜余地。"},{"name":"端妃","tag":"静水深流，后发制人","p":[2,4,2.8,3,0.5,4],"quote":"你看得懂暗潮，却并不急着站在浪头。","strong":"沉静克制，擅长识别关键时机。","weak":"太能忍耐，偶尔忽略自己的需求。"},{"name":"敬妃","tag":"温柔周全，稳中求安","p":[1,2.8,3.8,2.2,0.5,2.8],"quote":"不必成为最耀眼的人，也能守住最珍贵的生活。","strong":"顾全他人，稳定踏实。","weak":"为了和谐，可能让自己的意愿退后。"},{"name":"曹贵人","tag":"审时度势，务实求存","p":[3.3,4,2,1,1,4],"quote":"你知道每个决定都有代价，也知道借力的重要。","strong":"善于处理现实限制和风险。","weak":"过分倚重外部庇护时，容易丧失主动。"},{"name":"齐妃","tag":"重情守护，渴望安稳","p":[1.7,0.8,4,0.8,2.5,2.8],"quote":"你最深的愿望，不是战胜所有人，而是不失去珍惜的人。","strong":"愿意为了重要的人付出。","weak":"在恐惧失去时，容易做出冲动选择。"}]};
const labels=['权力取向','谋略布局','情义投入','自主独立','外显锋芒','防御意识'];
const weights=[1,1.1,1.05,1,0.9,1];
let stage='start',idx=0,answers=Array(15).fill(null),result=null;
const app=document.getElementById('app');
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function button(label,act,cls='cta',disabled=false){return `<button class="${cls}" data-act="${act}" ${disabled?'disabled':''}>${label}</button>`}
function header(){return '<div class="top"><span>后 宫 命 格 录</span><span class="seal">宫<br>签</span></div>'}
function render(){if(stage==='start'){app.innerHTML=`<section class="screen">${header()}<div class="orn">❖</div><h1>测测你是<br>《甄嬛传》里的谁？</h1><p class="sub">十五道深宫抉择，<br>照见你藏在选择里的另一面。</p><div class="hero"><span class="lotus">❀</span></div>${button('启 封 · 入 宫','start')}<div class="foot">约 5–7 分钟｜非官方影视人物趣味测试<br>不收集、不上传你的答案</div></section>`;return}
if(stage==='quiz'){let q=DATA.questions[idx];app.innerHTML=`<section class="screen">${header()}<div class="progress"><div class="bar" style="width:${(idx+1)/15*100}%"></div></div><div class="chapter">第 ${String(idx+1).padStart(2,'0')} 签 / 共十五签</div><div class="orn">❖</div><div class="scene">${esc(q.scene)}</div><h2>${esc(q.title)}</h2><div class="context">${esc(q.context)}</div><div class="ask">${esc(q.ask)}</div><div class="opts">${q.options.map((s,j)=>`<button class="opt ${answers[idx]===j?'chosen':''}" data-choice="${j}" aria-pressed="${answers[idx]===j}"><em>${'甲乙丙丁'[j]}</em><span>${esc(s)}</span></button>`).join('')}</div><div class="nav">${button('上一签','prev','outline',idx===0)}${button(idx===14?'揭 晓 命 格':'下 一 签','next','cta',answers[idx]===null)}</div><div class="foot">按你的真实反应选择，没有标准答案</div></section>`;return}
if(stage==='result'){let a=result.first,b=result.second;const explanations=result.explanations;app.innerHTML=`<section class="screen">${header()}<div class="orn">❖</div><p class="sub">十五道抉择，命格已定</p><div id="share" class="result-card"><div class="muted">后 宫 命 格 录　·　你 的 本 命 人 物</div><div class="orn">✥</div><div class="result-name">${esc(a.name)}</div><div class="tag">${esc(a.tag)}</div><p class="quote">「${esc(a.quote)}」</p><div class="divider"></div><div style="text-align:left;line-height:1.9;font-size:14px"><b>你的隐藏优势</b><p>${esc(a.strong)}</p><b>你的性格软肋</b><p>${esc(a.weak)}</p></div><div class="foot">原创视觉 · 非官方影视趣味测试</div></div><h3 class="section-title">为什么你是 ${esc(a.name)}？</h3><p class="muted">我们综合了十五道题的六类行为倾向，以下三项来自你的真实选择：</p>${explanations.map(e=>`<div class="reason"><small>第 ${e.index+1} 签 · ${esc(DATA.questions[e.index].scene)}</small>你选了「${esc(e.answer)}」。<br>${esc(e.why)}</div>`).join('')}<h3 class="section-title">你的六维宫廷人格</h3>${labels.map((x,j)=>`<div class="meter"><span>${x}</span><div class="track"><div class="fill" style="width:${Math.round(result.average[j]*25)}%"></div></div><b>${Math.round(result.average[j]*25)}</b></div>`).join('')}<div class="secondary"><b>你的另一面：${esc(b.name)}</b><br><span class="muted">${esc(b.tag)}。你的作答也呈现出与她相近的行为倾向。两种特质并不矛盾。</span></div><div class="actions">${button('保存结果卡为图片','save')}${button('复制结果文字','copy','outline')}${button('重新入宫','reset','outline')}</div><div class="foot">这是依据创作者设定的人物原型生成的娱乐性匹配，非心理诊断。<br>结果与《甄嬛传》电视剧、演员及版权方无官方关联。</div></section>`;return}}
// The six dimensions use scores 0–4 per option. Compare to ten fixed, auditable character vectors.
function calculate(ans){if(ans.length!==15||ans.some((x,i)=>!Number.isInteger(x)||x<0||x>3))throw Error('答题数据不完整');let avg=Array(6).fill(0);ans.forEach((v,i)=>DATA.questions[i].vectors[v].forEach((n,j)=>avg[j]+=n/15));let scores=DATA.roles.map((r,k)=>({role:r,index:k,d:Math.sqrt(r.p.reduce((sum,x,j)=>sum+weights[j]*(x-avg[j])**2,0))})).sort((a,b)=>a.d-b.d||a.index-b.index);let first=scores[0].role,second=scores[1].role;let reasons=ans.map((v,i)=>{let vec=DATA.questions[i].vectors[v];let aligned=vec.reduce((s,x,j)=>s+weights[j]*(x-first.p[j])**2,0);let distinct=Math.abs(vec[0]-2)+Math.abs(vec[1]-2)+Math.abs(vec[2]-2)+Math.abs(vec[3]-2)+Math.abs(vec[4]-2)+Math.abs(vec[5]-2);return {index:i,answer:DATA.questions[i].options[v],aligned,distinct,vec}}).sort((x,y)=>x.aligned-y.aligned||y.distinct-x.distinct||x.index-y.index);
let chosen=[],used=new Set();for(const r of reasons){let group=r.index<5?0:r.index<10?1:2;if(used.has(group))continue;chosen.push(r);used.add(group);if(chosen.length===3)break}if(chosen.length<3)for(const r of reasons)if(!chosen.includes(r)&&chosen.length<3)chosen.push(r);
const messages=['你在这里对地位与主动权的态度，与你的本命人物相近。','你处理复杂局势的方式，体现了相似的谋划节奏。','你对关系与情义的取舍，反映了相近的重视程度。','你在自主选择与依赖之间的偏好，与她较为接近。','你面对冲突时展现锋芒的方式，是这次匹配的线索之一。','你为不确定性预留退路的方式，也与她的角色画像相符。'];
let explanations=chosen.sort((a,b)=>a.index-b.index).map(x=>{const j=x.vec.map((n,k)=>({k,d:Math.abs(n-first.p[k])})).sort((a,b)=>a.d-b.d||a.k-b.k)[0].k;return {...x,why:messages[j]}});
return {first,second,average:avg,explanations,scores};}
function saveCard(){const card=document.getElementById('share');const w=720,h=950;const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');if(!ctx)return;ctx.fillStyle='#f9f0e6';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#cdb79b';ctx.lineWidth=3;ctx.strokeRect(25,25,w-50,h-50);ctx.strokeRect(38,38,w-76,h-76);ctx.textAlign='center';ctx.fillStyle='#906c59';ctx.font='28px serif';ctx.fillText('后 宫 命 格 录',w/2,115);ctx.fillStyle='#a86673';ctx.font='60px serif';ctx.fillText('❖',w/2,215);ctx.fillStyle='#733f4b';ctx.font='bold 86px serif';ctx.fillText(result.first.name,w/2,365);ctx.fillStyle='#9c626d';ctx.font='32px serif';ctx.fillText(result.first.tag,w/2,425);function lines(text,y,size,color,max=19){ctx.font=size+'px serif';ctx.fillStyle=color;let line='',out=[];for(const char of text){if(line.length>=max){out.push(line);line=''}line+=char}if(line)out.push(line);for(let s of out){ctx.fillText(s,w/2,y);y+=size*1.7}return y}let y=lines('「'+result.first.quote+'」',520,30,'#6e5450',18);ctx.strokeStyle='#cebca9';ctx.beginPath();ctx.moveTo(140,y+14);ctx.lineTo(580,y+14);ctx.stroke();y+=75;y=lines('隐藏优势：'+result.first.strong,y,25,'#6f5954',23);y+=24;lines('性格软肋：'+result.first.weak,y,25,'#6f5954',23);ctx.fillStyle='#9c897d';ctx.font='20px serif';ctx.fillText('非官方 · 影视人物趣味测试',w/2,870);c.toBlob(blob=>{if(!blob){alert('图片生成失败，请截图保存');return}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='我的后宫命格-'+result.first.name+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)},'image/png')}
app.addEventListener('click',async e=>{let choice=e.target.closest('[data-choice]');if(choice){answers[idx]=Number(choice.dataset.choice);render();return}let el=e.target.closest('[data-act]');if(!el||el.disabled)return;let act=el.dataset.act;if(act==='start'){stage='quiz';idx=0}else if(act==='prev'){idx=Math.max(0,idx-1)}else if(act==='next'){if(answers[idx]===null)return;if(idx===14){result=calculate(answers);stage='result'}else idx++}else if(act==='reset'){stage='start';idx=0;answers=Array(15).fill(null);result=null}else if(act==='save'){saveCard();return}else if(act==='copy'){let s=`我的本命人物：${result.first.name}\n${result.first.tag}\n${result.first.quote}\n隐藏优势：${result.first.strong}\n性格软肋：${result.first.weak}\n第二相似人物：${result.second.name}`;try{await navigator.clipboard.writeText(s);alert('结果已复制')}catch(_){prompt('复制这段结果：',s)}return}render();window.scrollTo({top:0,behavior:'instant'})});
window.quizAudit={DATA,calculate};render();
</script></body></html>
